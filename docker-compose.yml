# CS Virtual Lab on one VPS: Postgres + the app (API and web) + Caddy for HTTPS.
# Copy .env.example to .env, set POSTGRES_PASSWORD and DOMAIN, then: docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cslab
      POSTGRES_USER: cslab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cslab -d cslab']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cslab:${POSTGRES_PASSWORD}@db:5432/cslab
      PORT: 8787
      RESEARCH_SALT: ${RESEARCH_SALT:?Set RESEARCH_SALT in .env}
    # Operational logs: method, path, status and timing only; rotated so they expire in weeks, not years.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8787'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  dbdata:
  caddy_data:
  caddy_config:
